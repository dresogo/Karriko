name: karriko_website
description: >-
  Prototyp der öffentlichen Website von Karriko in Jaspr (T-12.1, T-8.3):
  serverseitig gerendertes HTML ohne JavaScript, die App läuft getrennt unter
  /app (E-1.17).
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  jaspr_router: ^0.9.0
  # Dieselben Regeln wie App und Functions, ohne Kopie (E-04): Scores,
  # Schrumpfung, Sichtbarkeitsgrenzen.
  questionnaire_core:
    path: ../packages/questionnaire_core

dev_dependencies:
  build_runner: ^2.15.1
  jaspr_builder: ^0.23.5
  lints: ^6.1.0

jaspr:
  mode: server
