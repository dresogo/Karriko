name: karriko_functions
description: >-
  Der gemeinsame Teil der Appwrite Functions von Karriko: Konfiguration,
  Tabellenzugriff, Laden der Fragendefinition und das Schreiben einer
  Bewertung.
publish_to: 'none'
version: 1.0.0

# Reines Dart. Laeuft in der Appwrite-Runtime (dart-3.11), nicht im Browser.
environment:
  sdk: ^3.4.0

dependencies:
  # Server-SDK. Anders als `appwrite` im Client kennt es API-Schluessel und
  # Team-Abfragen.
  dart_appwrite: ^29.0.0
  # Nur fuer den gesalzenen Hash der Geraetekennung.
  crypto: ^3.0.0
  questionnaire_core:
    path: ../questionnaire_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
