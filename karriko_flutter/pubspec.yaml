name: karriko_flutter
description: "Karriko – Bewertungsplattform für duale Ausbildung im DACH-Markt."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # Deutsche Beschriftungen der eingebauten Material-Dialoge (Datumswaehler).
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  appwrite: ^25.4.0
  dio: ^5.4.3
  intl: ^0.20.0
  cached_network_image: ^3.3.1
  # QR-Code fuer die TOTP-Einrichtung. Reines Dart (zieht nur `qr` nach),
  # keine nativen Bindungen und kein Netzwerkzugriff.
  qr_flutter: ^4.1.0
  # Nur fuer die Seitenweiterleitung beim Anbieter-Login (siehe
  # data/services/oauth_redirect.dart). Lag ohnehin transitiv vor; hier
  # deklariert, damit der direkte Zugriff nicht auf einem Zufall beruht.
  web: ^1.1.1
  # Der Entwurf wird nach jeder Antwort lokal gespeichert, damit ein
  # geschlossener Tab keine halbe Stunde Arbeit kostet. localStorage direkt
  # ueber package:web ginge im Browser, traegt aber auf iOS und Android nicht.
  shared_preferences: ^2.3.0
  # Fragebogenlogik, die Client und Appwrite Function gemeinsam benutzen.
  # Reines Dart, siehe packages/questionnaire_core/README.md.
  questionnaire_core:
    path: ../packages/questionnaire_core
  # Echte Links (<a href>) im Web ueber das Link-Widget: Rechtsklick, neuer
  # Tab, Adresse in der Statuszeile. Lag ohnehin transitiv vor.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # Die Fragendefinition. Im Betrieb wird die aktive Version aus dem
    # Appwrite-Storage geladen; dieses Asset ist der Rueckfall, wenn das
    # scheitert. Es muss Zeichen fuer Zeichen mit
    # appwrite/questionnaires/questionnaire_v1.json uebereinstimmen — dafuer
    # gibt es `dart run tools/sync_questionnaire.dart`.
    - assets/questionnaire/questionnaire_v1.json
    # Beispielliste der Ausbildungsberufe fuer S3. Die vollstaendige Liste
    # entsteht mit `dart run tools/import_berufe.dart` aus einer CSV der
    # Bundesagentur fuer Arbeit; siehe notes/REVIEW_TEXTE.md.
    - assets/data/berufe_beispiel.json

  # Inter 4.1 aus dem offiziellen Release (github.com/rsms/inter), Lizenz OFL
  # in assets/fonts/inter/LICENSE.txt. Eingebettet statt ueber google_fonts
  # geladen: Kein Seitenaufruf soll Google die IP des Besuchers verraten, und
  # die Content-Security-Policy kommt so ohne fonts.gstatic.com aus.
  # Nur die Staerken, die die App verwendet; 500 setzt Material intern ein.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/inter/Inter-ExtraBold.ttf
          weight: 800
