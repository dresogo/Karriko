name: Passkey-Dienst CI

on:
  push:
    branches: [main]
    paths:
      - 'services/passkey-rp/**'
      - '.github/workflows/passkey-rp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/passkey-rp/**'
      - '.github/workflows/passkey-rp.yml'

# Nur Lesezugriff auf den Code. Kein Schritt hier schreibt ins Repository.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/passkey-rp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/passkey-rp/package-lock.json

      # --ignore-scripts: Installationsskripte von Abhaengigkeiten laufen bei
      # jedem CI-Lauf mit vollen Rechten. Fuer diesen Dienst braucht sie keine.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

      - run: npm audit --audit-level=high
