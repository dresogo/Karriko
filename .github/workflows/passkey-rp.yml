name: Passkey-Dienst CI

on:
  push:
    branches: [main]
    paths:
      - 'services/passkey-rp/**'
      - '.github/workflows/passkey-rp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/passkey-rp/**'
      - '.github/workflows/passkey-rp.yml'

# Nur Lesezugriff auf den Code. Kein Schritt hier schreibt ins Repository.
permissions:
  contents: read

jobs:
  typecheck-and-test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/passkey-rp

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/passkey-rp/package-lock.json

      # --ignore-scripts: Installationsskripte von Abhaengigkeiten laufen bei
      # jedem CI-Lauf mit vollen Rechten. Fuer diesen Dienst braucht sie keine.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm test

      - run: npm audit --audit-level=high
